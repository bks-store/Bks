<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/images/brand/logo-bks-monogram.png" />
    <link rel="apple-touch-icon" href="/images/brand/logo-bks-monogram.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Vérification Bing Webmaster Tools -->
    <meta name="msvalidate.01" content="32583D6785CA20A7C5E246AB0F9217C4" />

    <!-- Titre et description de base (remplacés page par page via react-helmet-async) -->
    <title>BKS — Sneakers &amp; Streetwear Dinan</title>
    <meta name="description" content="Boutique sneakers à Dinan — sélection exclusive Jordan, Nike, Adidas, New Balance. Chaque paire choisie à la main. Livraison France et international." />

    <!-- Open Graph par défaut -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BKS — Sneakers &amp; Streetwear Dinan" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://www.bks-store.com/" />
    <meta property="og:title" content="BKS — Sneakers &amp; Streetwear Dinan" />
    <meta property="og:description" content="Boutique sneakers à Dinan — sélection exclusive Jordan, Nike, Adidas, New Balance. Chaque paire choisie à la main." />
    <meta property="og:image" content="https://www.bks-store.com/logo-bks-banner.jpg" />
    <meta property="og:image:width" content="1942" />
    <meta property="og:image:height" content="809" />
    <meta property="og:image:alt" content="BKS — Beau Kiosque de Soulier, Dinan" />
    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BKS — Sneakers &amp; Streetwear Dinan" />
    <meta name="twitter:description" content="Boutique sneakers à Dinan — sélection exclusive Jordan, Nike, Adidas, New Balance." />
    <meta name="twitter:image" content="https://www.bks-store.com/logo-bks-banner.jpg" />


    <!-- Préconnexion Supabase pour réduire la latence DNS/TLS -->
    <link rel="preconnect" href="https://kfkaejnkwcmyqeynlvme.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://kfkaejnkwcmyqeynlvme.supabase.co" />

    <!-- Prevent FOUC on dark OS -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#13100c" />
  </head>
  <body>
    <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap">BKS — Boutique sneakers &amp; streetwear à Dinan, Bretagne</h1>
    <div id="root"></div>
    <div id="bks-splash" style="
      position:fixed;inset:0;z-index:9999;
      background:#F5EFE6;
      display:flex;align-items:center;justify-content:center;
      transition:opacity .35s ease, visibility .35s ease;
    ">
      <img src="/images/brand/logo-bks-monogram.png" alt="BKS" width="80" height="80"
        style="opacity:0;transition:opacity .4s ease;animation:bks-pulse 1.4s ease-in-out infinite;"
        onload="this.style.opacity=1" />
    </div>
    <style>
      @keyframes bks-pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
    </style>
    <script>
      (function(){
        var s=document.getElementById('bks-splash');
        var done=function(){s.style.opacity='0';s.style.visibility='hidden';};
        // Se retire dès que React a rendu le contenu
        var ob=new MutationObserver(function(){
          if(document.getElementById('root').children.length){ob.disconnect();setTimeout(done,80);}
        });
        ob.observe(document.getElementById('root'),{childList:true,subtree:true});
        // Fallback au bout de 4s
        setTimeout(done,4000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
